name: Shiro
options:
  bundleIdPrefix: io.github.westernpluto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Shiro:
    type: application
    platform: iOS
    sources:
      - path: Shiro
        excludes:
          - "Info.plist"
          - "Shiro.entitlements"
    info:
      path: Shiro/Info.plist
    entitlements:
      path: Shiro/Shiro.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.westernpluto.shiro
        PRODUCT_NAME: Shiro
        INFOPLIST_FILE: Shiro/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shiro/Shiro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: Shiro/Bridge/Shiro-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/Chiaki/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/Chiaki/lib"
        OTHER_LDFLAGS: "$(inherited) -lchiaki-ios -lz -lresolv"
        GCC_OPTIMIZATION_LEVEL: "3"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_STRICT_CONCURRENCY: minimal
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        CLANG_ENABLE_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_COMPILATION_MODE: singlefile
    dependencies:
      - sdk: VideoToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreHaptics.framework
      - sdk: GameController.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
    scheme:
      configurations:
        Run: Debug
        Archive: Release
